name: webOS checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  still4k:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r tools/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Restore test media
        id: media
        uses: actions/cache@v4
        with:
          path: apps/still4k/assets
          key: still4k-assets-${{ hashFiles('tools/still4k/make_assets.py', 'tools/requirements.txt') }}
      - name: Generate test media
        if: steps.media.outputs.cache-hit != 'true'
        run: npm run still4k:assets
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run still4k:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: okuyuki-still4k-ipk
          path: dist/*.ipk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
